[project]
name = "hpc-top"
version = "0.1.0"
description = "Interactive terminal view of your jobs on the UniCal HPC cluster"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["textual>=8.2"]

[project.scripts]
hpc-top = "hpc_top.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
